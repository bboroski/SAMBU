version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "05:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "05:20"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
