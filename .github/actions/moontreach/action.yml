name: MoonTreach
description: Shared path-aware test planning and read-only merge evidence for the repository fleet.
inputs:
  mode:
    description: validate, plan, run, queue, or inspect-pr
    required: true
  suite:
    description: Configured test suite id for run mode
    required: false
    default: ''
  base:
    description: Base commit SHA for plan mode
    required: false
    default: ''
  head:
    description: Head commit SHA for plan mode
    required: false
    default: ''
  force_all:
    description: Run all configured suites
    required: false
    default: 'false'
  repository:
    description: owner/name for inspect-pr
    required: false
    default: ''
  number:
    description: Pull request number for inspect-pr
    required: false
    default: ''
  token:
    description: Optional read-only token for GitHub API inventory
    required: false
    default: ''
outputs:
  matrix:
    description: JSON matrix selected by the planner
    value: ${{ steps.engine.outputs.matrix }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Unpack the shared engine
      shell: bash
      run: |
        python -c 'import gzip, os, pathlib; p=pathlib.Path(os.environ["GITHUB_ACTION_PATH"]); (pathlib.Path(os.environ["RUNNER_TEMP"])/"moontreach.py").write_bytes(gzip.decompress((p/"moontreach.py.gz").read_bytes()))'
    - name: Run MoonTreach engine
      id: engine
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        MOONTREACH_ROOT: ${{ github.workspace }}
        MOONTREACH_TOKEN: ${{ inputs.token }}
        MT_MODE: ${{ inputs.mode }}
        MT_SUITE: ${{ inputs.suite }}
        MT_BASE: ${{ inputs.base }}
        MT_HEAD: ${{ inputs.head }}
        MT_FORCE_ALL: ${{ inputs.force_all }}
        MT_REPOSITORY: ${{ inputs.repository }}
        MT_NUMBER: ${{ inputs.number }}
      run: |
        set -euo pipefail
        case "$MT_MODE" in
          validate)
            python "$RUNNER_TEMP/moontreach.py" validate
            PYTHONPATH="$RUNNER_TEMP" python -m unittest discover -s "$GITHUB_ACTION_PATH" -p 'test_*.py' -v
            ;;
          plan)
            args=()
            if [ "$MT_FORCE_ALL" = "true" ]; then args+=(--all); fi
            python "$RUNNER_TEMP/moontreach.py" plan --base "$MT_BASE" --head "$MT_HEAD" "${args[@]}"
            ;;
          run)
            if [[ ! "$MT_SUITE" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
              echo 'Invalid MoonTreach suite id' >&2
              exit 2
            fi
            python "$RUNNER_TEMP/moontreach.py" run "$MT_SUITE"
            ;;
          queue)
            python "$RUNNER_TEMP/moontreach.py" queue
            ;;
          inspect-pr)
            python "$RUNNER_TEMP/moontreach.py" inspect-pr "MT_REPOSITORY" "$MT_NUMBER"
            ;;
         *)
            echo "Unsupported MoonTreach mode: $MT_MODE" >&2
            exit 2
            ;;
        esac
