name: Beelzebub Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beelzebub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-scanner:
    name: Validate repository-local Beelzebub scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile local scanner
        run: python3 -m py_compile .beelzebub/scan.py
      - name: Run local scanner self-test
        run: python3 -I .beelzebub/scan.py --self-test

  audit:
    uses: bboroski/Hellduck/.github/workflows/beelzebub-reusable.yml@3a14ba22fb6008fed79203ef85290f784b09771b
    permissions:
      contents: read
