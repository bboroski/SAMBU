# Black Duck SCA is the only provider enabled in this workflow.
# Configure BLACKDUCKSCA_URL (Actions variable) and BLACKDUCKSCA_TOKEN (Actions secret)
# as documented in docs/BLACK_DUCK_SECURITY_SCAN.md.

name: CI Black Duck SCA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "42 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackduck-sca-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  blackduck-sca:
    name: Black Duck SCA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Validate Black Duck SCA configuration
        id: config
        shell: bash
        env:
          BLACKDUCKSCA_URL: ${{ vars.BLACKDUCKSCA_URL }}
          BLACKDUCKSCA_TOKEN: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          IS_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}
        run: |
          set -euo pipefail

          # GitHub intentionally withholds repository secrets from fork-originated
          # pull_request workflows. Never switch to pull_request_target to work around it.
          if [[ "$IS_FORK_PULL_REQUEST" == "true" ]]; then
            echo "scan_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Black Duck SCA skipped: GitHub does not expose repository secrets to fork pull requests."
            exit 0
          fi

          missing_url=false
          missing_token=false
          if [[ -z "$BLACKDUCKSCA_URL" ]]; then
            missing_url=true
            echo "::error::Missing Actions variable BLACKDUCKSCA_URL."
          fi
          if [[ -z "$BLACKDUCKSCA_TOKEN" ]]; then
            missing_token=true
            echo "::error::Missing Actions secret BLACKDUCKSCA_TOKEN."
          fi
          if [[ "$missing_url" == "true" || "$missing_token" == "true" ]]; then
            echo "::error::Configure both values using docs/BLACK_DUCK_SECURITY_SCAN.md, then rerun this workflow."
            exit 1
          fi

          if [[ ! "$BLACKDUCKSCA_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::BLACKDUCKSCA_URL must be an HTTPS base URL supplied by your Black Duck administrator."
            exit 1
          fi

          echo "scan_enabled=true" >> "$GITHUB_OUTPUT"
          echo "Black Duck SCA configuration is present. Credentials are not printed."

      - name: Checkout source
        if: steps.config.outputs.scan_enabled == 'true'
        uses: actions/checkout@v4

      - name: Black Duck SCA scan
        if: steps.config.outputs.scan_enabled == 'true'
        uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f
        env:
          DETECT_PROJECT_NAME: ${{ github.event.repository.name }}
          DETECT_PROJECT_VERSION_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
        with:
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          # Full branch scan on push/schedule/manual runs; differential PR scan on pull requests.
          blackducksca_scan_full: ${{ github.event_name != 'pull_request' }}
          # Keep the security gate explicit and consistent with the action's default policy.
          blackducksca_scan_failure_severities: "CRITICAL,HIGH"
          # Diagnostics are disabled to avoid uploading extra scan logs by default.
          include_diagnostics: false
