name: SAMBU tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: sambu-test tests --repeat 2
      - run: sambu examples/percentages.sambu
      - run: sambu examples/anatidae_biophysics.sambu
      - run: sambu examples/voxel_world.sambu
      - run: sambu examples/ideal_gas.sambu
      - run: sambu examples/boltzmann_weights.sambu
      - run: sambu examples/neo_modern_diplomat.sambu
      - run: sambu examples/community_hub.sambu
      - run: sambu examples/territory_control.sambu
      - run: sambu examples/commerce_queue.sambu
      - run: sambu examples/neo_modern_blueprint.sambu
      - run: sambu examples/text_craft.sambu
      - run: sambu examples/workflows.sambu
      - run: sambu examples/04coq_filtering.sambu
      - run: sambu-studio inspect examples/magento_reference
      - run: sambu-studio inspect examples/magento_reference --format json > /tmp/sambu-studio-report.json
      - run: python -c "import json; report=json.load(open('/tmp/sambu-studio-report.json', encoding='utf-8')); assert report['is_valid'] and report['summary']['plugins'] == 1"

  web-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[web]"
      - run: python -m unittest discover -s tests -p test_integrations.py -v

  engine-bridges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path engine_adapters/bevy/Cargo.toml
