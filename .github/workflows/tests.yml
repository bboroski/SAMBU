name: SAMBU tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: sambu examples/ideal_gas.sambu
      - run: sambu examples/boltzmann_weights.sambu
      - run: sambu examples/neo_modern_diplomat.sambu
      - run: sambu examples/community_hub.sambu
      - run: sambu examples/territory_control.sambu
