name: SAMBU tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile desktop IDE entry point
        run: python -m py_compile sambu_ide/app.py
      - run: python -m unittest discover -s tests -v
      - run: sambu-test tests --repeat 2
      - run: sambu examples/percentages.sambu
      - run: sambu examples/anatidae_biophysics.sambu
      - run: sambu examples/ecosystem_primitives.sambu
      - run: sambu examples/voxel_world.sambu
      - run: sambu examples/supervised_runtime.sambu
      - run: sambu examples/mulberry_charlotte.sambu
      - name: Exercise creative metadata CLI
        run: |
          sambu creative clusters --json > /tmp/sambu-creative-clusters.json
          python -c "import json; data=json.load(open('/tmp/sambu-creative-clusters.json')); assert len(data) == 9 and data[0]['id'] == 'T-001' and data[-1]['id'] == 'T-009'"
          sambu creative validate examples/creative_metadata.sample.json --json > /tmp/sambu-creative-metadata.json
          python -c "import json; data=json.load(open('/tmp/sambu-creative-metadata.json')); assert len(data) == 1 and data[0]['safety_flag'] == 'NEEDS_REVIEW'"
      - run: sambu machine architecture --json > /tmp/sambu-architecture.json
      - run: python -c "import json; assert json.load(open('/tmp/sambu-architecture.json'))['valid']"
      - run: sambu machine check examples --json > /tmp/sambu-machine-check.json
      - run: python -c "import json; report=json.load(open('/tmp/sambu-machine-check.json')); assert report['valid'] and report['files_checked'] > 0"
      - run: sambu machine sample examples/mulberry_charlotte.sambu --ratio 100 --seed 17 --json > /tmp/sambu-sample.json
      - run: python -c "import json; report=json.load(open('/tmp/sambu-sample.json')); assert report['statements_sampled'] > 0 and report['seed'] == 17"
      - run: sambu ide inspect examples/mulberry_charlotte.sambu --format json > /tmp/sambu-ide-inspect.json
      - run: python -c "import json; report=json.load(open('/tmp/sambu-ide-inspect.json')); assert report['syntax_valid'] and report['token_count'] > 0"
      - run: sambu ide workspace examples --format json > /tmp/sambu-ide-workspace.json
      - run: python -c "import json; assert json.load(open('/tmp/sambu-ide-workspace.json'))['valid']"
      - run: sambu ide complete actor
      - run: python benchmarks/benchmark_voxels.py --size 6 --repeats 1 --include-spectral --json
      - run: sambu examples/ideal_gas.sambu
      - run: sambu examples/boltzmann_weights.sambu
      - run: sambu examples/neo_modern_diplomat.sambu
      - run: sambu examples/community_hub.sambu
      - run: sambu examples/territory_control.sambu
      - run: sambu examples/commerce_queue.sambu
      - run: sambu examples/neo_modern_blueprint.sambu
      - run: sambu examples/text_craft.sambu
      - run: sambu examples/language_craft.sambu
      - run: sambu examples/workflows.sambu
      - run: sambu examples/04coq_filtering.sambu
      - run: sambu-studio inspect examples/magento_reference
      - run: sambu-studio inspect examples/magento_reference --format json > /tmp/sambu-studio-report.json
      - run: python -c "import json; report=json.load(open('/tmp/sambu-studio-report.json', encoding='utf-8')); assert report['is_valid'] and report['summary']['plugins'] == 1"

  web-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[web]"
      - run: python -m unittest discover -s tests -p test_integrations.py -v

  engine-bridges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path engine_adapters/bevy/Cargo.toml
