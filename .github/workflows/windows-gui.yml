name: SAMBU Windows desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-gui:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Tkinter availability
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Install SAMBU
        run: python -m pip install -e .
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Verify desktop entry point registration
        run: python -c "from importlib.metadata import entry_points; assert any(e.name == 'sambu-ide' for e in entry_points(group='console_scripts'))"
      - name: Verify Apple diagnostics module
        run: python -c "from sambu_ide.device_diagnostics import scan_apple_devices; print(scan_apple_devices()['summary'])"
