name: Octopus Ippon Release — SAMBU

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: octopus-ippon-sambu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: SAMBU compatibility matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit and language test suites
        run: |
          python -m unittest discover -s tests -v
          sambu-test tests --repeat 2
      - name: Validate machine-readable examples
        run: |
          sambu machine architecture --json > /tmp/sambu-architecture.json
          python -c "import json; assert json.load(open('/tmp/sambu-architecture.json'))['valid']"
          sambu machine check examples --json > /tmp/sambu-machine-check.json
          python -c "import json; r=json.load(open('/tmp/sambu-machine-check.json')); assert r['valid'] and r['files_checked'] > 0"
      - name: Execute representative language programs
        run: |
          sambu examples/percentages.sambu
          sambu examples/anatidae_biophysics.sambu
          sambu examples/voxel_world.sambu
          sambu examples/supervised_runtime.sambu

  package-and-release:
    name: Build, attest and publish SAMBU package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate tag against package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag != version:
              raise SystemExit(f"Tag v{tag} does not match pyproject.toml version {version}")
          PY
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz sbom.spdx.json > SHA256SUMS
      - name: Attest package and SBOM
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: sambu-release-evidence
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for version tags only
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SAMBU ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

