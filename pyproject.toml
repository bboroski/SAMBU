[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sambu-language"
version = "0.2.0"
description = "A scientific and systems-modeling language for physics, networks, negotiation and operations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SAMBU contributors" }]
keywords = ["programming-language", "scientific-computing", "statistical-mechanics", "boltzmann", "physics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.scripts]
sambu = "sambu.cli:main"

[tool.setuptools.packages.find]
include = ["sambu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
