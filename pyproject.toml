[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sambu-language"
version = "0.11.0"
description = "Python-hosted scientific systems language with language craft, Pascal/Delphi/Fortran compatibility, Apple device diagnostics and sparse voxel systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SAMBU contributors" }]
keywords = ["programming-language","scientific-computing","statistical-mechanics","boltzmann","physics","magento","adobe-commerce","rabbitmq","architecture-modeling","audio-production","community-operations","game-mechanics","text-analysis","prosody","rhetoric","rhyme","workflow-modeling","accreditation-records","batch-planning","text-mining","filtering","rule-engine","data-quality","04coq","voxel-computing","sparse-octree","spectral-graph-theory","game-engine-tools","avian-physiology","actor-model","cooperative-scheduling","supervision","code-sampling","failure-ledger","developer-tools","headless-ide","language-design","grammar-design","parser-construction","syntax-tooling","formal-grammar","language-craft","iphone-diagnostics","ipad-diagnostics","libimobiledevice","windows-usb","device-toolkit","ru-en-localization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
flask = ["Flask>=3.0"]
django = ["Django>=4.2"]
fastapi = ["fastapi>=0.110"]
web = ["Flask>=3.0", "Django>=4.2", "fastapi>=0.110"]

[project.scripts]
smae = "sambu.cli:main"
sambu = "sambu.cli:main"
sambu-studio = "sambu_studio.cli:main"
sambu-ide = "sambu_ide.app:main"
sambu-test = "sambu.testing:main"

[tool.setuptools.packages.find]
include = ["sambu*", "sambu_studio*", "sambu_ide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
