[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sambu-language"
version = "0.11.0"
description = "A Python-hosted scientific systems language with actors, project tooling, headless IDE services and sparse voxel systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SAMBU contributors" }]
keywords = ["programming-language", "scientific-computing", "statistical-mechanics", "boltzmann", "physics", "magento", "adobe-commerce", "rabbitmq", "architecture-modeling", "audio-production", "community-operations", "game-mechanics", "text-analysis", "prosody", "rhetoric", "rhyme", "workflow-modeling", "accreditation-records", "batch-planning", "text-mining", "filtering", "rule-engine", "data-quality", "04coq", "voxel-computing", "sparse-octree", "spectral-graph-theory", "game-engine-tools", "avian-physiology", "actor-model", "cooperative-scheduling", "supervision", "code-sampling", "failure-ledger", "developer-tools", "headless-ide"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
flask = ["Flask>=3.0"]
django = ["Django>=4.2"]
fastapi = ["fastapi>=0.110"]
web = ["Flask>=3.0", "Django>=4.2", "fastapi>=0.110"]

[project.scripts]
sambu = "sambu.cli:main"
sambu-studio = "sambu_studio.cli:main"
sambu-test = "sambu.testing:main"

[tool.setuptools.packages.find]
include = ["sambu*", "sambu_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
