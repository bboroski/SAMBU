<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">SAMBU duck family</title>
  <desc id="desc">A calm pond scene with one parent duck and three ducklings, drawn in a clean editorial vector style.</desc>
  <defs>
