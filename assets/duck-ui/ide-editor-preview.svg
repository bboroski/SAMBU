<text x="354" y="166" fill="#999999"># Minimal deterministic example</text>
<text x="354" y="246" fill="#FFD600">let</text><text x="398" y="246" fill="#E6E6E6"> message = </text><text x="515" y="246" fill="#4CAF50">"Hello from SAMBU"</text>
<text x="354" y="286" fill="#FFD600">let</text><text x="398" y="286" fill="#E6E6E6"> samples = [3, 5, 8, 13]</text>
<text x="354" y="326" fill="#FFD600">let</text><text x="398" y="326" fill="#E6E6E6"> total = sum(samples)</text>
<text x="354" y="366" fill="#FFD600">print</text><text x="420" y="366" fill="#E6E6E6">(message)</text>
<text x="354" y="406" fill="#FFD600">print</text><text x="420" y="406" fill="#E6E6E6">(total)</text>
</g>
