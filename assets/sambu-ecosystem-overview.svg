  <text x="720" y="264" text-anchor="middle" font-size="15" fill="#9bb5d0" letter-spacing="4">CENTRAL ENGINEERING PLATFORM</text>
  <circle cx="720" cy="390" r="132" fill="#1b3450" stroke="url(#hub)" stroke-width="5" filter="url(#glow)"/>
  <circle cx="720" cy="390" r="106" fill="#142940" stroke="#6fd7c4" stroke-opacity=".3" stroke-width="2"/>
  <text x="720" y="376" text-anchor="middle" font-size="43" font-weight="850" letter-spacing="2">SAMBU</text>
  <text x="720" y="414" text-anchor="middle" font-size="16" fill="#b7d7ef">Language · policy · architecture</text>
  <text x="720" y="444" text-anchor="middle" font-size="14" fill="#87a7c6">Tooling · contracts · module registry</text>
  <text x="720" y="728" text-anchor="middle" font-size="14" fill="#7892ae">One platform · six specialized modules · explicit adapters · independent builds</text>
