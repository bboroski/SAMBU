<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">SAMBU Ecosystem — central platform and six specialized modules</title>
<desc id="desc">SAMBU is the central engineering platform. Kloz, CO, SaintSI, ReaperCripple, ToolNG and Klipot connect as independently buildable modules through explicit contracts and adapters.</desc>
