  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#13243b"/></linearGradient>
  <linearGradient id="hub" x2="1"><stop stop-color="#75e0cb"/><stop offset="1" stop-color="#77a9ff"/></linearGradient>
  <linearGradient id="card" x2="1" y2="1"><stop stop-color="#19334d"/><stop offset="1" stop-color="#11243a"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1440" height="760" rx="36" fill="url(#bg)"/>
<g fill="none" stroke="#5b7897" stroke-width="2" opacity=".75">
  <path d="M720 380L270 185M720 380L720 140M720 380L1170 185M720 380L270 570M720 380L720 620M720 380L1170 570"/>
</g>
<g fill="url(#card)" stroke="#416486" stroke-width="2">
  <rect x="94" y="108" width="352" height="150" rx="22"/>
  <rect x="544" y="60" width="352" height="150" rx="22"/>
  <rect x="994" y="108" width="352" height="150" rx="22"/>
  <rect x="94" y="492" width="352" height="150" rx="22"/>
  <rect x="544" y="542" width="352" height="150" rx="22"/>
  <rect x="994" y="492" width="352" height="150" rx="22"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#eff6ff">
  <g font-size="27" font-weight="750">
    <text x="128" y="160">Kloz</text>
    <text x="578" y="112">CO</text>
    <text x="1028" y="160">SaintSI</text>
    <text x="128" y="544">ReaperCripple</text>
    <text x="578" y="594">Klipot</text>
    <text x="1028" y="544">ToolNG</text>
  </g>
  <g font-size="16" fill="#afc5dc">
    <text x="128" y="194">Platform ABI · memory · board boundary</text>
    <text x="578" y="146">Lifecycle · bounded execution</text>
    <text x="1028" y="194">Heartbeat · runtime assurance</text>
    <text x="128" y="578">BSP · calibration · fixtures · MES</text>
