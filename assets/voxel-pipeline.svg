<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="592" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">SAMBU sparse voxel processing pipeline</title>
<desc id="desc">The sparse voxel subsystem progresses from occupied cells through chunked spatial indexing to octrees, ray traversal, surface meshing, graph utilities and renderer-neutral engine payloads.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141414"/><stop offset="1" stop-color="#E6E6E6"/></linearGradient>
<style>.h{font:700 25px system-ui,sans-serif;fill:#0D0D0D}.t{font:700 16px system-ui,sans-serif;fill:#0D0D0D}.p{font:500 13px system-ui,sans-serif;fill:#262626}.a{stroke:#BFA100;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1200" height="370" rx="24" fill="url(#bg)"/>
<text x="42" y="54" class="h">SPARSE VOXEL PIPELINE</text>
<text x="42" y="80" class="p">Sparse storage preserves occupied space; spatial structures support bounded geometry and inspection.</text>
