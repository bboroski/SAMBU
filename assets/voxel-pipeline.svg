 <g stroke="#BFA100" stroke-width="2" fill="#141414"><path d="M102 50 57 82h90Z"/><path d="M102 50v32M57 82l-22 42h44Zm90 0-22 42h44ZM80 124v-31h44v31Z" fill="#E6E6E6"/></g>
